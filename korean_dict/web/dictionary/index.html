<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korean Dictionary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="site-nav" aria-label="Korean tools">
    <a href="../index.html">Home</a>
    <a href="../hangul/index.html">Hangul pronunciation</a>
  </nav>

  <h1>Korean Dictionary</h1>
  <p id="loadStatus" role="status">Loading dictionary indexes…</p>

  <div id="dictionaryApp" hidden>
    <aside id="sidebar">
      <label for="sortSelect">Browse index</label>
      <select id="sortSelect">
        <option value="by_frequency">Frequency</option>
        <option value="by_alphabet">Hangul alphabet</option>
        <option value="by_length_customalpha">Word length</option>
        <option value="by_length_freq_customalpha">Length, then frequency</option>
        <option value="by_keylength_alpha">Length, then alphabet</option>
        <option value="by_filtered_length_freq_customalpha">Frequent words by length</option>
      </select>

      <label for="searchInput">Search Hangul, Jamo, or English</label>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Search dictionary">

      <label for="pageSize">Words per page</label>
      <select id="pageSize">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>

      <div id="bookmarks" aria-label="Index shortcuts"></div>
    </aside>

    <main id="main">
      <p id="position" aria-live="polite"></p>
      <section id="entries" class="entries" aria-label="Dictionary entries"></section>
      <div id="controls">
        <button id="prevBtn" type="button">Previous page</button>
        <button id="nextBtn" type="button">Next page</button>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
